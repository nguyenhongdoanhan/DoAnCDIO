{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đặt lại mật khẩu</title>

  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/auth.css' %}">

  <style>
    .auth-box h2 {
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .input-group input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #dcdcdc;
      font-size: 14px;
      transition: 0.2s;
    }

    .input-group input:focus {
      border-color: #2f5bea;
      outline: none;
      box-shadow: 0 0 0 2px rgba(47, 91, 234, 0.15);
    }

    .btn-primary {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, #2f5bea, #1e3fcf);
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .errorlist {
      color: #d93025;
      font-size: 13px;
      margin-bottom: 8px;
      list-style: none;
      padding-left: 0;
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="auth-box">
    <h2>Nhập mật khẩu mới</h2>

    {% if validlink %}
    <form method="post">
      {% csrf_token %}

      <div class="input-group">
        <label>Mật khẩu mới</label>
        {{ form.new_password1.errors }}
        {{ form.new_password1 }}
      </div>

      <div class="input-group">
        <label>Xác nhận mật khẩu</label>
        {{ form.new_password2.errors }}
        {{ form.new_password2 }}
      </div>

      <button type="submit" class="btn-primary">
        Đổi mật khẩu
      </button>
    </form>
    {% else %}
      <p>Link đã hết hạn hoặc không hợp lệ.</p>
    {% endif %}

  </div>
</div>

</body>
</html>
